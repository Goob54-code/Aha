name: Deploy to GitHub Pages

# Publishes the game so it is playable at https://goob54-code.github.io/Aha/

on:
  push:
    branches: [main, claude/mobile-fps-game-ih4797]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, cancelling in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages for the repo if it isn't already.
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the whole repo root (index.html lives here).
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
